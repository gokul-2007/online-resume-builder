# Server Configuration
server.port=8080

# MySQL Database Configuration
# Hibernate will automatically create the 'resumedb' database and all tables in MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/resumedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JSON Web Token (JWT) Security Configuration
jwt.secret=9a3f2c4e6b8a1d0f5c7e9b3a1d4f6c8e0a2b4c6e8f0a2d4c6e8b0a2d4f6c8e0a
jwt.expiration-ms=86400000

# File Upload limits (if needed for profile photo or files)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
